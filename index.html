<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#ff5c8a">

    <title>Semana da Mãe Maluca 🤪</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <!-- Cabeçalho -->
        <header class="header">

            <div class="emoji-title">🤪</div>

            <h1>Semana da Mãe Maluca</h1>

            <p>
                Porque a semana é das crianças...
                mas quem sofre somos nós! 😂
            </p>

        </header>


        <!-- Personagem -->
        <section class="character-area">

            <div id="character" class="character">
                🤯
            </div>

            <div id="speech" class="speech">
                Vamos começar! Eu acho que vai dar tudo certo...
            </div>

        </section>


      <!-- Progresso -->
<section class="progress-area">

    <!-- Imagem da jornada da mãe -->
    <div class="progress-banner">
        <img src="maeMaluca.png" alt="Evolução da Mãe na Semana Maluca" style="width: 100%; height: auto; border-radius: 12px; margin-bottom: 15px; display: block;">
    </div>

    <div class="progress-info">
        <span>Missão da semana</span>
        <strong>
            <span id="completed">0</span>/4
        </strong>
    </div>

    <div class="progress-bar">
        <div id="progress" class="progress"></div>
    </div>

</section>


        <!-- Lista de atividades -->
        <section class="activities">

            <label class="activity" data-day="1">

                <input type="checkbox">

                <div class="activity-number">
                    1
                </div>

                <div class="activity-info">

                    <h2>Dia do Cabelo Maluco 💇‍♀️</h2>

                    <p>
                        Preparar o cabelo mais doido possível!
                    </p>

                </div>

                <div class="check">
                    ✓
                </div>

            </label>


            <label class="activity" data-day="2">

                <input type="checkbox">

                <div class="activity-number">
                    2
                </div>

                <div class="activity-info">

                    <h2>Dia da Mochila Maluca 🎒</h2>

                    <p>
                        Porque uma mochila normal seria fácil demais.
                    </p>

                </div>

                <div class="check">
                    ✓
                </div>

            </label>


            <label class="activity" data-day="3">

                <input type="checkbox">

                <div class="activity-number">
                    3
                </div>

                <div class="activity-info">

                    <h2>Dia da Roupa Colorida 🌈</h2>

                    <p>
                        Quanto mais cores, melhor!
                    </p>

                </div>

                <div class="check">
                    ✓
                </div>

            </label>


            <label class="activity" data-day="4">

                <input type="checkbox">

                <div class="activity-number">
                    4
                </div>

                <div class="activity-info">

                    <h2>Dia do Pijama Divertido 🛌</h2>

                    <p>
                        O último desafio da sobrevivência!
                    </p>

                </div>

                <div class="check">
                    ✓
                </div>

            </label>

        </section>


        <!-- Mensagem final -->

        <section id="final-message" class="final-message">

            <div class="final-emoji">
                🥳
            </div>

            <h2>
                SOBREVIVEMOS!
            </h2>

            <p>
                A Semana da Criança acabou.
                A mãe pode descansar.
            </p>

            <button id="resetButton">
                🔄 Começar novamente
            </button>

        </section>


        <footer>

            Feito com amor, criatividade
            e um pouquinho de desespero. 😂

        </footer>

    </main>


    <!-- Confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
